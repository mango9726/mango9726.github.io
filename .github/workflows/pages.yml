name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  zone: github-pages
  region: web
  wait-concurrency: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          publish_dir: web/vocab
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/vocab
      - name: Deploy
        uses: actions/deploy-pages@v4
