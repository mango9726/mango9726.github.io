<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>authtest</title>
</head>
<body>
<button id="sidebarAuthBtn"><span>Login</span></button>
<pre id="out">pending</pre>
<script>
  // --- Stubs needed by auth.js ---
  window.VocabApp = {
    t: function (k) { return k; },
    toast: function () {},
    getStats: function () { return null; }
  };
  window.CefrSelector = { onLogin: function () {}, onLogout: function () {} };
  window.FIREBASE_CONFIGURED = false;

  window.SecureStore = (function () {
    var cache = {};
    return {
      ready: Promise.resolve(),
      available: true,
      load: function (k, fb) {
        if (Object.prototype.hasOwnProperty.call(cache, k)) {
          try { return JSON.parse(cache[k]); } catch (e) { return fb; }
        }
        try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }
        catch (e) { return fb; }
      },
      save: function (k, val) {
        try { cache[k] = JSON.stringify(val); } catch (e) { return; }
        try { localStorage.setItem(k, cache[k]); } catch (e) {}
      },
      remove: function (k) { delete cache[k]; try { localStorage.removeItem(k); } catch (e) {} },
      clear: function () { cache = {}; try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("vocab_") === 0) localStorage.removeItem(k); }); } catch (e) {} }
    };
  })();

  window.VocabAuth = null;
</script>
<script src="assets/js/auth.js"></script>
<script>
  (function () {
    var out = document.getElementById("out");
    var log = [];
    function report(name, ok, detail) { log.push((ok ? "PASS" : "FAIL") + " | " + name + (detail ? " | " + detail : "")); }
    function dump() {
      var text = log.join("\n");
      out.textContent = text;
      try { sessionStorage.setItem("authtest_done", text); } catch (e) {}
      document.title = log.some(function (l) { return l.indexOf("FAIL") === 0; }) ? "AUTHTEST_FAIL" : "AUTHTEST_PASS";
    }

    var q = new URLSearchParams(location.search);
    var scenario = q.get("scenario") || "seed";
    try {
      var done = sessionStorage.getItem("authtest_done");
      if (done !== null && done !== undefined) {
        out.textContent = done;
        document.title = done.indexOf("FAIL") === 0 ? "AUTHTEST_FAIL" : "AUTHTEST_PASS";
        return;
      }
    } catch (e) {}

    localStorage.clear();
    sessionStorage.clear();
    window.__VOCAB_TEST_PROMPT__ = null;

    var V = window.VocabAuth;

    function uniq(p) { return p + "_" + Date.now().toString(36) + "_" + Math.floor(Math.random() * 1e6).toString(36); }

    if (scenario === "github-login") {
      // Backend available → GitHub sign-in with a prompt-autofilled username.
      window.__VOCAB_TEST_PROMPT__ = "gh_" + uniq("gh");
      V.signInWithGithub().then(function (r) {
        var u = V.getUser();
        report("github returns user", !!r && !!r.username, "r=" + JSON.stringify(r));
        report("github user persisted", !!u && u.provider === "github", "provider=" + (u && u.provider));
        report("github logged in", V.isLoggedIn() === true);
        // Now logout then login via auto-password path? We just verify session; logout check separately.
        dump();
      }).catch(function (e) { report("github-login threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "apple-login") {
      window.__VOCAB_TEST_PROMPT__ = "apple_" + uniq("ap") + "@icloud.com";
      V.signInWithApple().then(function (r) {
        var u = V.getUser();
        report("apple returns user", !!r && !!r.username);
        report("apple user persisted", !!u && u.provider === "apple", "provider=" + (u && u.provider));
        report("apple logged in", V.isLoggedIn() === true);
        dump();
      }).catch(function (e) { report("apple-login threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "forgot-reset-backend") {
      // Register a real backend user, forget password, get reset code, reset, then login with new pw.
      var u = uniq("fr");
      V.register(u, "oldpass1", true).then(function () {
        return V.forgotPassword(u);
      }).then(function (res) {
        report("forgot returns backend reset code", res.mode === "backend" && !!res.resetCode, "mode=" + res.mode + " code=" + res.resetCode);
        return V.resetPasswordWithCode(u, res.resetCode, "newpass1");
      }).then(function () {
        return V.logout();
      }).then(function () {
        return V.login(u, "newpass1", true);
      }).then(function () {
        report("login with new password works", V.isLoggedIn() === true);
        dump();
      }).catch(function (e) { report("forgot-reset-backend threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "change-password-backend") {
      var u = uniq("cp");
      V.register(u, "oldpass1", true).then(function () {
        return V.changePassword("wrongpass", "newpass1");
      }).then(function () {
        report("change-password with wrong current rejected", false, "should have thrown");
        return V.logout().then(dump);
      }).catch(function (e) {
        report("wrong current rejected", true, String(e && e.message || e));
        return V.changePassword("oldpass1", "newpass1");
      }).then(function () {
        return V.logout();
      }).then(function () {
        return V.login(u, "newpass1", true);
      }).then(function () {
        report("login with changed password works", V.isLoggedIn() === true);
        dump();
      }).catch(function (e) { report("change-password-backend threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "change-email-backend") {
      var u2 = uniq("ce");
      V.register(u2, "pass1234", true).then(function () {
        return V.changeEmail("newname@example.com");
      }).then(function () {
        var u = V.getUser();
        report("change-email persisted", u && u.email === "newname@example.com", "email=" + (u && u.email));
        dump();
      }).catch(function (e) { report("change-email-backend threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "change-username-static") {
      // Static mode only — re-key users/tokens maps.
      var u3 = uniq("cu");
      V.register(u3, "pass1234", true).then(function () {
        return V.changeUsername(u3 + "_new");
      }).then(function () {
        var u = V.getUser();
        var users = JSON.parse(localStorage.getItem("vocab_static_users_v1") || "{}");
        var tokens = JSON.parse(localStorage.getItem("vocab_static_tokens_v1") || "{}");
        report("change-username persisted", !!u && u.username === u3 + "_new", "username=" + (u && u.username));
        report("users map re-keyed", !!users[u3 + "_new"] && !users[u3], "hasNew=" + !!users[u3 + "_new"] + " hasOld=" + !!users[u3]);
        report("tokens re-keyed", Object.keys(tokens).every(function (t) { return tokens[t].username !== u3; }));
        dump();
      }).catch(function (e) { report("change-username-static threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "change-password-static") {
      var u4 = uniq("sp");
      V.register(u4, "pass1234", true).then(function () {
        return V.changePassword("wrong", "newpass1");
      }).then(function () {
        report("wrong current rejected", false, "should have thrown");
        dump();
      }).catch(function (e) {
        report("wrong current rejected", true, String(e && e.message || e));
        return V.changePassword("pass1234", "newpass1");
      }).then(function () {
        return V.logout();
      }).then(function () {
        return V.login(u4, "newpass1", true);
      }).then(function () {
        report("login with new password works", V.isLoggedIn() === true);
        dump();
      }).catch(function (e) { report("change-password-static threw", false, String(e && e.message || e)); dump(); });
    } else if (scenario === "static-reset") {
      var u5 = uniq("sr");
      V.register(u5, "pass1234", true).then(function () {
        return V.logout();
      }).then(function () {
        return V.forgotPassword(u5);
      }).then(function (res) {
        report("static forgot returns static mode", res.mode === "static" && res.username === u5, "mode=" + res.mode);
        // Static reset is UI-driven (showStaticResetModal) — verify via direct hash change is not possible through API;
        // we validate the mode routing + that register data remains untouched.
        dump();
      }).catch(function (e) { report("static-reset threw", false, String(e && e.message || e)); dump(); });
    } else {
      report("unknown scenario", false, scenario);
      dump();
    }
  })();
</script>
</body>
</html>
