<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>guesttest</title>
</head>
<body>
<button id="sidebarAuthBtn"><span>Login</span></button>
<pre id="out">pending</pre>
<script>
  // --- Stubs needed by auth.js ---
  window.VocabApp = {
    t: function (k) { return k; },
    toast: function () {},
    getStats: function () { return null; }
  };
  window.CefrSelector = { onLogin: function () {}, onLogout: function () {} };
  window.FIREBASE_CONFIGURED = false;

  // Minimal SecureStore stub (localStorage-backed, mirrors the real one).
  window.SecureStore = (function () {
    var cache = {};
    return {
      ready: Promise.resolve(),
      available: true,
      load: function (k, fb) {
        if (Object.prototype.hasOwnProperty.call(cache, k)) {
          try { return JSON.parse(cache[k]); } catch (e) { return fb; }
        }
        try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }
        catch (e) { return fb; }
      },
      save: function (k, val) {
        try { cache[k] = JSON.stringify(val); } catch (e) { return; }
        try { localStorage.setItem(k, cache[k]); } catch (e) {}
      },
      remove: function (k) {
        delete cache[k];
        try { localStorage.removeItem(k); } catch (e) {}
      },
      clear: function () {
        cache = {};
        try {
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf("vocab_") === 0) localStorage.removeItem(k);
          });
        } catch (e) {}
      }
    };
  })();

  window.VocabAuth = null; // set by auth.js below
</script>
<script src="assets/js/auth.js"></script>
<script>
  (function () {
    var out = document.getElementById("out");
    var log = [];
    function report(name, ok, detail) {
      log.push((ok ? "PASS" : "FAIL") + " | " + name + (detail ? " | " + detail : ""));
    }
    function dump() {
      out.textContent = log.join("\n");
      document.title = log.some(function (l) { return l.indexOf("FAIL") === 0; }) ? "GUESTTEST_FAIL" : "GUESTTEST_PASS";
    }

    // Prevent logout() from actually reloading the page during the test.
    try { window.location.reload = function () {}; } catch (e) {}

    var q = new URLSearchParams(location.search);
    var scenario = q.get("scenario") || "seed";

    if (scenario === "seed" || scenario === "seed-keep") {
      localStorage.clear();
      sessionStorage.clear();
      if (scenario === "seed") {
        localStorage.setItem("vocab_progress_v1", JSON.stringify({ day: 1, xp: 999 }));
        localStorage.setItem("vocab_settings_v1", JSON.stringify({ lang: "en" }));
        window.VocabAuth.resetGuestDataIfNewSession();
        var p = localStorage.getItem("vocab_progress_v1");
        var s = localStorage.getItem("vocab_settings_v1");
        report("guest new-session resets progress", p === null, "progress=" + p);
        report("guest new-session resets settings", s === null, "settings=" + s);
        report("session marker set", sessionStorage.getItem("vocab_guest_session") === "1");
      } else {
        sessionStorage.setItem("vocab_guest_session", "1");
        localStorage.setItem("vocab_progress_v1", JSON.stringify({ day: 1, xp: 999 }));
        localStorage.setItem("vocab_settings_v1", JSON.stringify({ lang: "en" }));
        window.VocabAuth.resetGuestDataIfNewSession();
        var p2 = localStorage.getItem("vocab_progress_v1");
        report("guest same-session keeps progress", p2 !== null && JSON.parse(p2).xp === 999, "progress=" + p2);
      }
      dump();
    } else if (scenario === "register-saves") {
      localStorage.clear();
      sessionStorage.clear();
      window.SecureStore.save("vocab_progress_v1", { day: 1, xp: 555 });
      window.SecureStore.save("vocab_game_v1", { xp: 555, xpByDay: {} });
      window.SecureStore.save("vocab_settings_v1", { lang: "th" });
      window.VocabAuth.register("alice", "pass1234", true).then(function () {
        var user = window.VocabAuth.getUser();
        var saved = JSON.parse(localStorage.getItem("vocab_static_data_" + user.userId) || "{}");
        var p = JSON.parse(saved.vocab_progress_v1 || "{}");
        report("register returns user", !!user && user.username === "alice");
        report("guest progress saved to account", p.xp === 555, "xp=" + p.xp);
        report("guest game saved to account", (JSON.parse(saved.vocab_game_v1 || "{}").xp) === 555);
        report("still logged in", window.VocabAuth.isLoggedIn() === true);
        dump();
      }).catch(function (e) {
        report("register-saves threw", false, String(e && e.message || e));
        dump();
      });
    } else if (scenario === "logout-keeps") {
      localStorage.clear();
      sessionStorage.clear();
      window.SecureStore.save("vocab_progress_v1", { day: 1, xp: 777 });
      window.SecureStore.save("vocab_game_v1", { xp: 777, xpByDay: {} });
      window.VocabAuth.register("bob", "pass1234", true).then(function () {
        var user = window.VocabAuth.getUser();
        var userId = user.userId;
        return window.VocabAuth.logout().then(function () {
          // pushLocalDataToAccount ran before clearing, so account copy survives.
          var saved = JSON.parse(localStorage.getItem("vocab_static_data_" + userId) || "{}");
          var p = JSON.parse(saved.vocab_progress_v1 || "{}");
          report("logout retains account data", p.xp === 777, "saved xp=" + p.xp);
          report("auth cleared on logout", window.VocabAuth.isLoggedIn() === false);
          report("guest marker cleared", sessionStorage.getItem("vocab_guest_session") === null);
          dump();
        });
      }).catch(function (e) {
        report("logout-keeps threw", false, String(e && e.message || e));
        dump();
      });
    } else if (scenario === "login-restores") {
      localStorage.clear();
      sessionStorage.clear();
      window.SecureStore.save("vocab_progress_v1", { day: 1, xp: 888 });
      window.SecureStore.save("vocab_game_v1", { xp: 888, xpByDay: {} });
      window.VocabAuth.register("carol", "pass1234", true).then(function () {
        return window.VocabAuth.logout().then(function () {
          return window.VocabAuth.login("carol", "pass1234", true);
        }).then(function () {
          var restored = window.SecureStore.load("vocab_progress_v1", null);
          report("re-login restores progress", !!restored && restored.xp === 888, "xp=" + (restored && restored.xp));
          var game = window.SecureStore.load("vocab_game_v1", null);
          report("re-login restores game", !!game && game.xp === 888, "game.xp=" + (game && game.xp));
          report("logged in again", window.VocabAuth.isLoggedIn() === true);
          dump();
        });
      }).catch(function (e) {
        report("login-restores threw", false, String(e && e.message || e));
        dump();
      });
    } else {
      report("unknown scenario", false, scenario);
      dump();
    }
  })();
</script>
</body>
</html>
