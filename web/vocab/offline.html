<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <title>Offline · Vocab Trainer</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }
    .offline-card { max-width: 420px; }
    .offline-card .brand-logo { margin: 0 auto 18px; }
    .offline-card h1 { font-size: 26px; margin-bottom: 10px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .offline-card p { color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="offline-card panel">
    <span class="brand-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v5c0 1 2.5 2.5 5 2.5S17 17 17 16v-5"/><path d="M21 9v5"/></svg></span>
    <h1>You're offline</h1>
    <p>Vocab Trainer needs a connection to load this time. Your progress is safely saved on this device — reconnect and pick up right where you left off.</p>
  </div>
</body>
</html>
