<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<style>
  body { margin: 0; background: #fff; font-family: "Leelawadee UI", "Segoe UI", sans-serif; }
</style>
</head>
<body>
<svg width="1080" height="1300" viewBox="0 0 1080 1300" xmlns="http://www.w3.org/2000/svg" font-family="Leelawadee UI, Segoe UI, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1f2340"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c8590"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2340">ผังงานการทำงานของระบบ (Flowchart)</text>
  <text x="540" y="52" text-anchor="middle" font-size="13.5" fill="#5b5f7a">การเชื่อมโยงข้อมูลผู้ใช้ · คลังคำศัพท์ · สถิติการเรียนรู้</text>

  <!-- 1 START -->
  <ellipse cx="400" cy="118" rx="90" ry="28" fill="#f7f7fa" stroke="#1f2340" stroke-width="2"/>
  <text x="400" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2340">เริ่ม</text>
  <line x1="400" y1="146" x2="400" y2="168" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 LOAD USER DATA (Input) -->
  <polygon points="262,172 610,172 584,248 240,248" fill="#f3f4ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="425" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">โหลดข้อมูลผู้ใช้และการตั้งค่า</text>
  <text x="425" y="222" text-anchor="middle" font-size="11.5" fill="#6b6f8c">ระดับ CEFR · แผนรายวัน · สถิติ streak</text>
  <line x1="400" y1="248" x2="400" y2="272" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 DECISION: has placement test? -->
  <polygon points="230,336 400,268 570,336 400,404" fill="#f7f7fa" stroke="#1f2340" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2340">มีผลวัดระดับ?</text>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#6b6f8c">(Placement Test)</text>
  <text x="420" y="414" font-size="11.5" font-weight="700" fill="#b45309">ไม่ใช่</text>
  <line x1="400" y1="404" x2="400" y2="422" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>
  <text x="590" y="324" font-size="11.5" font-weight="700" fill="#047857">ใช่</text>
  <polyline points="570,336 668,336 668,584 578,584" fill="none" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 PLACEMENT TEST (Process) -->
  <rect x="230" y="426" width="340" height="80" rx="7" fill="#f7f7fa" stroke="#1f2340" stroke-width="2"/>
  <text x="400" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">ทำแบบทดสอบวัดระดับ</text>
  <text x="400" y="477" text-anchor="middle" font-size="11.5" fill="#6b6f8c">Adaptive IRT · ประเมินจนได้ระดับที่มั่นใจ</text>
  <text x="400" y="495" text-anchor="middle" font-size="11.5" fill="#6b6f8c">→ บันทึกผลลัพธ์ไว้ในข้อมูลผู้ใช้ (ระดับ CEFR)</text>
  <line x1="400" y1="506" x2="400" y2="536" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5 PICK TODAY'S WORDS (Process) -->
  <rect x="230" y="540" width="340" height="76" rx="7" fill="#eff9ff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="400" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">กำหนดคำศัพท์ของวันตามระดับ CEFR</text>
  <text x="400" y="590" text-anchor="middle" font-size="11.5" fill="#0b77a8">A1–C2 · 480 วัน · กว่า 4,800 คำ (อ่านจากคลังคำศัพท์)</text>
  <line x1="400" y1="616" x2="400" y2="638" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 6 SHOW WORDS / GAMES (Input/Output) -->
  <polygon points="262,642 610,642 584,722 240,722" fill="#eff9ff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="425" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">แสดงคำศัพท์ / มินิเกม</text>
  <text x="425" y="692" text-anchor="middle" font-size="11.5" fill="#6b6f8c">ให้ผู้ใช้ฝึกเรียนและทบทวนคำ</text>
  <line x1="400" y1="722" x2="400" y2="754" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 7 DECISION: correct? -->
  <polygon points="230,828 400,760 570,828 400,896" fill="#f7f7fa" stroke="#1f2340" stroke-width="2"/>
  <text x="400" y="822" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2340">ตอบคำถูก?</text>
  <text x="400" y="844" text-anchor="middle" font-size="11" fill="#6b6f8c">(การทบทวนคำ)</text>
  <text x="420" y="906" font-size="11.5" font-weight="700" fill="#b45309">ไม่ใช่</text>
  <line x1="400" y1="896" x2="400" y2="916" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>
  <text x="592" y="816" font-size="11.5" font-weight="700" fill="#047857">ใช่</text>
  <line x1="570" y1="828" x2="654" y2="828" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 8 NO -> FSRS reset (Output) -->
  <polygon points="262,920 610,920 584,998 240,998" fill="#eefbf4" stroke="#10b981" stroke-width="2.5"/>
  <text x="425" y="946" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">FSRS-5: due = วันนี้</text>
  <text x="425" y="970" text-anchor="middle" font-size="11.5" fill="#0b6b4c">จำนวนครั้งที่ลืม +1 → ต้องทบทวนอีกครั้ง</text>
  <line x1="400" y1="998" x2="400" y2="1066" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 9 YES -> FSRS due next (Output, right) -->
  <polygon points="668,770 960,770 932,862 640,862" fill="#eefbf4" stroke="#10b981" stroke-width="2.5"/>
  <text x="800" y="798" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">FSRS-5: due = วันถัดไป</text>
  <text x="800" y="822" text-anchor="middle" font-size="11.5" fill="#0b6b4c">ช่วงห่างเพิ่มขึ้นตามระดับความจำ</text>
  <polyline points="800,862 800,1074 580,1074" fill="none" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 10 UPDATE STATS (Process) -->
  <rect x="230" y="1070" width="340" height="70" rx="7" fill="#eefbf4" stroke="#10b981" stroke-width="2.5"/>
  <text x="400" y="1098" text-anchor="middle" font-size="13" font-weight="700" fill="#33354d">อัปเดตสถิติการเรียนรู้</text>
  <text x="400" y="1120" text-anchor="middle" font-size="11.5" fill="#0b6b4c">history · learned · XP · streak</text>

  <!-- 11 END -->
  <line x1="400" y1="1140" x2="400" y2="1150" stroke="#1f2340" stroke-width="2" marker-end="url(#ar)"/>
  <ellipse cx="400" cy="1182" rx="90" ry="28" fill="#f7f7fa" stroke="#1f2340" stroke-width="2"/>
  <text x="400" y="1187" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2340">จบ</text>

  <!-- REVIEW LOOP: routed outside right side so it never crosses any box -->
  <polyline points="570,1102 1000,1102 1000,665 606,665" fill="none" stroke="#7c8590" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arG)"/>
  <text x="812" y="652" text-anchor="middle" font-size="12" fill="#5f6772">คำที่ถึงกำหนด due → กลับมาทบทวน (ลูปเว้นระยะ FSRS)</text>

  <!-- LEGEND -->
  <rect x="140" y="1216" width="800" height="54" rx="9" fill="#fafafc" stroke="#d5d8e8"/>
  <text x="160" y="1238" font-size="11.5" fill="#4a4d63">
    <tspan font-weight="700">วงรี</tspan> = เริ่ม / จบ ·
    <tspan x="300" font-weight="700">สี่เหลี่ยม</tspan> = กระบวนการ ·
    <tspan x="452" font-weight="700">ข้าวหลามตัด</tspan> = การตัดสินใจ ·
    <tspan x="612" font-weight="700">ด้านขนาน</tspan> = อ่าน/เขียนข้อมูล ·
    <tspan x="782" font-weight="700">เส้นประ</tspan> = วนกลับ
  </text>
  <text x="160" y="1258" font-size="12" fill="#33354d">
    <tspan fill="#6366f1" font-weight="700">■ ชุดข้อมูลผู้ใช้</tspan> ·
    <tspan fill="#0ea5e9" font-weight="700">■ คลังคำศัพท์ CEFR</tspan> ·
    <tspan fill="#10b981" font-weight="700">■ สถิติการเรียนรู้ (FSRS-5 / ประวัติ / XP)</tspan>
  </text>
</svg>
</body>
</html>
